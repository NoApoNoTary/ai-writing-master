name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install build
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
      - run: python -m compileall -q src tests
        env:
          PYTHONPYCACHEPREFIX: /tmp/awm-pyc
      - run: bash -n install.sh
      - run: |
          ./bin/writing-master --version
          ./bin/writing-master --help
          ./bin/writing-master learn --help
          ./bin/writing-master research --help
          ./bin/writing-master handoff --help
      - run: python -m build --outdir /tmp/awm-dist
