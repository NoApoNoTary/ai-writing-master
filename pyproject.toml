[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "writing-master"
version = "1.0.0"
description = "AI Writing Master - 融合深度流程与工程实践的智能写作系统"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "NoApoNoTary"}
]
dependencies = []

[project.urls]
Repository = "https://github.com/NoApoNoTary/ai-writing-master"
Homepage = "https://github.com/NoApoNoTary/ai-writing-master"

[project.scripts]
writing-master = "writing_master.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
