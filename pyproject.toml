[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "writing-master"
version = "1.0.0"
description = "AI Writing Master - 融合深度流程与工程实践的智能写作系统"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "NoApoNoTary", email = "noaponotary@example.com"}
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.urls]
Repository = "https://github.com/NoApoNoTary/ai-writing-master"
Homepage = "https://github.com/NoApoNoTary/ai-writing-master"

[project.scripts]
writing-master = "writing_master.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
writing_master = [
    "data/*.yaml",
    "data/*.md",
]
