target_id: wechat
label: 微信公众号
output_kind: long_form_article
rewrite_output_filename: wechat.md
min_chars: 1200
max_chars: 10000
length_unit: unicode_characters
needs_images: false
needs_html: true
needs_cover: true
tag_count: [0, 0]
required_derivatives:
  - formatted.md
  - wechat.html
  - cover.png
rewrite_brief: |
  微信公众号长文，目标是让读者愿意持续阅读、理解完整判断并保留文章。
  - 标题、摘要、开头和小标题共同建立阅读价值，不使用标题党补偿正文不足。
  - 每段只承担一个主要作用；长段拆分为适合移动端阅读的短段，并保留完整论证。
  - 关键事实、引用和限制条件不得因排版或传播性而删除。
  - 使用小标题、留白、列表或引文建立视觉停顿，不堆叠 emoji。
  - 正文通过审查后，组合 baoyu-format-markdown、baoyu-markdown-to-html 和
    baoyu-cover-image 生成 formatted.md、wechat.html 与 cover.png。
  - 平台适配只改组织和表达，不新增个人经历、数据或来源。
